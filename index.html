<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PixelFlow 接收端（网页版）</title>
<script src="html5-qrcode.min.js"></script>
<script src="sha256.js"></script>
<style>
    * { -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #f5f5f7; margin: 0; padding: 16px;
        display: flex; flex-direction: column; align-items: center;
        min-height: 100vh; box-sizing: border-box;
    }
    .container {
        background: #fff; border-radius: 16px; padding: 18px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        width: 100%; max-width: 420px; box-sizing: border-box; text-align: center;
    }
    h2 { margin: 0 0 12px; font-size: 18px; color: #1d1d1f; }

    #reader-wrapper {
        width: 100%; aspect-ratio: 1 / 1; overflow: hidden;
        border-radius: 12px; background: #000; margin-bottom: 14px;
    }
    #reader { width: 100% !important; height: 100% !important; border: none !important; }
    #reader video { object-fit: cover !important; }

    .status-card {
        background: #f5f5f7; border-radius: 10px; padding: 12px;
        margin-bottom: 12px; text-align: left; font-size: 13px; line-height: 1.5;
    }
    .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
    .name { font-weight: 600; color: #1d1d1f; word-break: break-all; }
    .pct { color: #34c759; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sub { color: #8e8e93; font-size: 12px; margin-top: 3px; }

    .progress-bar-bg { background: #e5e5ea; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 9px; display: none; }
    .progress-bar-fill { background: #34c759; height: 100%; width: 0%; transition: width 0.15s; }

    .chunks-grid {
        display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px;
        margin-top: 10px; max-height: 96px; overflow-y: auto; display: none;
    }
    .chunk-dot {
        aspect-ratio: 1; background: #e5e5ea; border-radius: 3px; font-size: 9px;
        display: flex; align-items: center; justify-content: center; color: #8e8e93;
    }
    .chunk-dot.done { background: #34c759; color: #fff; }

    #textPreviewBox {
        display: none; max-height: 130px; overflow-y: auto; background: #fff;
        border: 1px solid #d2d2d7; border-radius: 8px; padding: 9px; margin-top: 10px;
        font-size: 13px; text-align: left; white-space: pre-wrap; color: #333;
        word-break: break-word;
    }

    .btn {
        display: block; width: 100%; box-sizing: border-box; margin-top: 9px;
        border: none; border-radius: 10px; padding: 13px 16px;
        font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit;
        background: #0071e3; color: #fff;
    }
    .btn:active { opacity: 0.85; }
    .btn-download { background: #34c759; display: none; }
    .btn-copy { background: #5856d6; display: none; }
    .btn-reset { background: #ff3b30; display: none; }
    .btn-ghost { background: #e5e5ea; color: #1d1d1f; }

    .warn { color: #b25000; background: #fff4e5; border-radius: 8px; padding: 9px 10px; margin-top: 9px; font-size: 12px; line-height: 1.5; display: none; }
    .error { color: #ff3b30; font-weight: 600; background: #ffebeb; border-radius: 8px; padding: 9px 10px; margin-top: 9px; font-size: 13px; display: none; }
    .note { font-size: 12px; color: #8e8e93; margin-top: 12px; line-height: 1.5; text-align: left; }
</style>
</head>
<body>

<div class="container">
    <h2>PixelFlow 接收端（网页版）</h2>

    <div id="reader-wrapper"><div id="reader"></div></div>

    <div class="status-card">
        <div class="row">
            <span class="name" id="fileName">等待二维码</span>
            <span class="pct" id="pctText"></span>
        </div>
        <div class="sub" id="statusText">点击下方按钮授权摄像头后开始扫描</div>
        <div class="progress-bar-bg" id="progressBg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="chunks-grid" id="chunksGrid"></div>
        <div id="textPreviewBox"></div>
    </div>

    <div class="warn" id="warnBox"></div>
    <div class="error" id="errBox"></div>

    <button class="btn" id="startBtn">开启摄像头</button>
    <button class="btn btn-download" id="downloadBtn">存储文件</button>
    <button class="btn btn-copy" id="copyBtn">复制文本</button>
    <button class="btn btn-reset" id="resetBtn">重置</button>

    <div class="note">
        网页版每帧只能识别<b>一个</b>二维码。如果发送端用的是 2×2 / 3×3 多码阵列，
        建议改用 iPhone 原生 App，或把发送端切回 1×1。<br>
        浏览器要求安全上下文：以 <b>https</b> 或 <b>localhost</b> 打开本页，直接用 file:// 打开无法启用摄像头。
    </div>
</div>

<script>
(() => {
'use strict';

/* PF2 协议
 * 元信息: PF2|M|<kind>|<total>|<chunkSize>|<b64len>|<sha256>|<grid>|<name>
 * 数据:   PF2|D|<idx>|<payload>
 * name 恒为最后一个字段，用 slice 重组，因此文件名可包含 '|'。
 */

const $ = id => document.getElementById(id);
const fileNameEl = $('fileName'), pctText = $('pctText'), statusText = $('statusText');
const progressBg = $('progressBg'), progressFill = $('progressFill');
const chunksGrid = $('chunksGrid'), textPreviewBox = $('textPreviewBox');
const warnBox = $('warnBox'), errBox = $('errBox');
const startBtn = $('startBtn'), downloadBtn = $('downloadBtn');
const copyBtn = $('copyBtn'), resetBtn = $('resetBtn');

let scanner = null;
let busy = false;

let meta = null;
let chunks = [];
let received = 0;
let finished = false;

function parseFrame(text) {
    if (typeof text !== 'string' || !text.startsWith('PF2|')) return null;
    const p = text.split('|');
    if (p.length < 3) return null;

    if (p[1] === 'M') {
        if (p.length < 9) return null;
        const total = Number(p[3]);
        const chunkSize = Number(p[4]);
        const b64len = Number(p[5]);
        const grid = Number(p[7]);
        if (!Number.isFinite(total) || total < 0 || total > 500000) return null;
        if (!Number.isFinite(chunkSize) || chunkSize <= 0) return null;
        if (!Number.isFinite(b64len) || b64len < 0) return null;
        return {
            type: 'meta',
            kind: p[2],
            total, chunkSize, b64len,
            sha: p[6],
            grid: Number.isFinite(grid) ? grid : 1,
            name: p.slice(8).join('|') || 'received.bin'
        };
    }

    if (p[1] === 'D') {
        if (p.length < 4) return null;
        const idx = Number(p[2]);
        if (!Number.isInteger(idx) || idx < 1 || idx > 500000) return null;
        return { type: 'data', idx, payload: p.slice(3).join('|') };
    }

    return null;
}

function identity(m) {
    return `${m.sha}|${m.total}|${m.b64len}|${m.name}`;
}

function beginSession(m) {
    meta = m;
    chunks = new Array(m.total + 1).fill(undefined);
    received = 0;
    finished = false;

    fileNameEl.textContent = m.name;
    pctText.textContent = '0%';
    progressBg.style.display = 'block';
    progressFill.style.width = '0%';
    textPreviewBox.style.display = 'none';
    textPreviewBox.textContent = '';
    downloadBtn.style.display = 'none';
    copyBtn.style.display = 'none';
    errBox.style.display = 'none';

    chunksGrid.innerHTML = '';
    for (let i = 1; i <= m.total; i++) {
        const dot = document.createElement('div');
        dot.className = 'chunk-dot';
        dot.id = 'dot-' + i;
        dot.textContent = i;
        chunksGrid.appendChild(dot);
    }
    chunksGrid.style.display = m.total > 0 ? 'grid' : 'none';

    if (m.grid > 1) {
        warnBox.textContent = `发送端当前是 ${Math.round(Math.sqrt(m.grid))}×${Math.round(Math.sqrt(m.grid))} 多码阵列，网页版每帧只能识别一个码，会比较慢。建议改用 iPhone App。`;
        warnBox.style.display = 'block';
    } else {
        warnBox.style.display = 'none';
    }

    updateProgress();
    if (m.total === 0) finish();
}

function updateProgress() {
    if (!meta) return;
    const pct = meta.total > 0 ? Math.round(received / meta.total * 100) : 100;
    pctText.textContent = pct + '%';
    progressFill.style.width = pct + '%';
    statusText.textContent = `已接收 ${received} / ${meta.total} 片`;
}

function onFrame(text) {
    const f = parseFrame(text);
    if (!f) return;

    if (f.type === 'meta') {
        if (!meta) { beginSession(f); return; }
        if (identity(meta) === identity(f)) return;
        beginSession(f);
        return;
    }

    if (!meta || finished) return;
    if (f.idx > meta.total) return;
    if (chunks[f.idx] !== undefined) return;

    chunks[f.idx] = f.payload;
    received++;

    const dot = document.getElementById('dot-' + f.idx);
    if (dot) dot.className = 'chunk-dot done';

    updateProgress();
    if (received === meta.total) finish();
}

function finish() {
    finished = true;
    if (!meta) return;

    let joined = '';
    for (let i = 1; i <= meta.total; i++) {
        if (chunks[i] === undefined) {
            finished = false;
            return;
        }
        joined += chunks[i];
    }

    if (joined.length !== meta.b64len) {
        showError(`长度校验失败：收到 ${joined.length} 字符，协议声明 ${meta.b64len}`);
        return;
    }

    let bytes;
    try {
        const bin = atob(joined);
        bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    } catch (e) {
        showError('Base64 解码失败，数据可能已损坏');
        return;
    }

    let verified = false;
    if (meta.sha && meta.sha !== '-' && meta.sha.length === 64) {
        const hex = sha256Hex(bytes);
        if (hex !== meta.sha.toLowerCase()) {
            showError('SHA-256 校验失败，数据在传输中损坏了');
            return;
        }
        verified = true;
    }

    stopCamera();
    statusText.textContent = verified ? 'SHA-256 校验通过，接收完成' : '接收完成（发送端未提供校验值）';
    pctText.textContent = '100%';
    progressFill.style.width = '100%';
    chunksGrid.style.display = 'none';
    resetBtn.style.display = 'block';

    if (meta.kind === 't') {
        let text = '';
        try {
            text = new TextDecoder('utf-8', { fatal: false }).decode(bytes);
        } catch (e) {
            showError('文本解码失败');
            return;
        }
        textPreviewBox.textContent = text;
        textPreviewBox.style.display = 'block';
        copyBtn.style.display = 'block';
        window.__lastText = text;
    } else {
        window.__lastBlob = new Blob([bytes], { type: 'application/octet-stream' });
        downloadBtn.style.display = 'block';
        downloadBtn.textContent = `存储文件（${(bytes.length / 1024).toFixed(1)} KB）`;
    }
}

function showError(msg) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
}

function stopCamera() {
    if (scanner && scanner.isScanning) {
        scanner.stop().catch(() => {});
    }
}

function startCamera() {
    if (busy) return;
    busy = true;
    startBtn.style.display = 'none';
    resetBtn.style.display = 'block';

    if (!scanner) scanner = new Html5Qrcode('reader');
    if (scanner.isScanning) { busy = false; return; }

    scanner.start(
        { facingMode: 'environment' },
        { fps: 25, qrbox: (w, h) => ({ width: Math.round(w * 0.9), height: Math.round(h * 0.9) }) },
        onFrame
    ).catch(err => {
        showError('无法打开摄像头：' + err);
        startBtn.style.display = 'block';
    }).finally(() => { busy = false; });
}

function resetAll() {
    stopCamera();
    meta = null; chunks = []; received = 0; finished = false;
    window.__lastBlob = null; window.__lastText = '';

    fileNameEl.textContent = '等待二维码';
    pctText.textContent = '';
    statusText.textContent = '点击下方按钮授权摄像头后开始扫描';
    progressBg.style.display = 'none';
    progressFill.style.width = '0%';
    chunksGrid.style.display = 'none';
    chunksGrid.innerHTML = '';
    textPreviewBox.style.display = 'none';
    textPreviewBox.textContent = '';
    warnBox.style.display = 'none';
    errBox.style.display = 'none';
    downloadBtn.style.display = 'none';
    copyBtn.style.display = 'none';
    startBtn.style.display = 'block';
    resetBtn.style.display = 'none';
}

startBtn.addEventListener('click', startCamera);
resetBtn.addEventListener('click', resetAll);

downloadBtn.addEventListener('click', () => {
    if (!window.__lastBlob || !meta) return;
    const url = URL.createObjectURL(window.__lastBlob);
    const a = document.createElement('a');
    a.href = url;
    a.download = meta.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
});

copyBtn.addEventListener('click', async () => {
    const text = window.__lastText || '';
    try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = '已复制';
    } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); copyBtn.textContent = '已复制'; }
        catch (_) { copyBtn.textContent = '复制失败，请长按预览框选择'; }
        document.body.removeChild(ta);
    }
    setTimeout(() => { copyBtn.textContent = '复制文本'; }, 1800);
});

if (location.protocol === 'file:') {
    showError('当前以 file:// 打开，浏览器会拒绝摄像头权限。请用 https 或本地服务器（如 python3 -m http.server）访问本页。');
}
})();
</script>
</body>
</html>
