<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>二维码文件/文字接收器</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f5f7; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box; }
        .container { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 400px; box-sizing: border-box; text-align: center; }
        h2 { margin-top: 0; color: #1d1d1f; font-size: 19px; }
        
        #reader-wrapper { width: 100%; overflow: hidden; border-radius: 12px; background: #000; margin-bottom: 15px; position: relative; aspect-ratio: 1; }
        #reader { width: 100% !important; height: 100% !important; border: none !important; }
        #reader video { object-fit: cover !important; }
        
        .status-card { background: #f5f5f7; padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: left; font-size: 13px; word-break: break-all; }
        .progress-bar-bg { background: #e5e5ea; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 8px; display: none; }
        .progress-bar-fill { background: #34c759; height: 100%; width: 0%; transition: width 0.15s; }
        
        .chunks-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin-top: 10px; max-height: 100px; overflow-y: auto; }
        .chunk-dot { aspect-ratio: 1; background: #e5e5ea; border-radius: 2px; font-size: 9px; display: flex; align-items: center; justify-content: center; color: #8e8e93; }
        .chunk-dot.done { background: #34c759; color: white; }
        
        #textPreviewBox { display: none; max-height: 120px; overflow-y: auto; background: #fff; border: 1px solid #d2d2d7; padding: 8px; border-radius: 6px; margin-top: 10px; font-size: 13px; text-align: left; white-space: pre-wrap; color: #333; }

        .btn { background: #0071e3; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; display: block; box-sizing: border-box; }
        .btn-action { display: none; }
        .btn-download { background: #34c759; }
        .btn-copy { background: #5856d6; }
        .btn-reset { background: #ff3b30; margin-top: 10px; display: none; }
        .success-flash { animation: flash 0.15s ease-out; }
        @keyframes flash { 0% { background: rgba(52, 199, 89, 0.4); } 100% { background: white; } }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h2>二维码文件/文字传输 (接收端)</h2>
    
    <div id="reader-wrapper">
        <div id="reader"></div>
    </div>
    
    <div class="status-card">
        <div id="statusText">💡 请点击下方按钮允许摄像头权限开始扫描。</div>
        <div id="metaInfo"></div>
        <div class="progress-bar-bg" id="progressBg">
            <div class="progress-bar-fill" id="progressFill"></div>
        </div>
        <div class="chunks-grid" id="chunksGrid"></div>
        <div id="textPreviewBox"></div>
    </div>

    <button class="btn" id="startBtn">开启扫描相机</button>
    <button class="btn btn-action btn-download" id="downloadBtn">💾 下载还原文件</button>
    <button class="btn btn-action btn-copy" id="copyBtn">📋 一键复制文本</button>
    <button class="btn btn-reset" id="resetBtn">重置清空</button>
</div>

<script>
    let html5QrCode = null;
    let transferType = 'file'; 
    let fileName = '';
    let totalChunks = 0;
    let receivedChunks = {}; 
    let isMetaReceived = false;
    let lastScannedData = ''; 

    const startBtn = document.getElementById('startBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const copyBtn = document.getElementById('copyBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statusText = document.getElementById('statusText');
    const metaInfo = document.getElementById('metaInfo');
    const progressBg = document.getElementById('progressBg');
    const progressFill = document.getElementById('progressFill');
    const chunksGrid = document.getElementById('chunksGrid');
    const textPreviewBox = document.getElementById('textPreviewBox');
    const mainContainer = document.getElementById('mainContainer');

    startBtn.addEventListener('click', startCamera);
    downloadBtn.addEventListener('click', downloadFile);
    copyBtn.addEventListener('click', copyTextData);
    resetBtn.addEventListener('click', resetAll);

    function startCamera() {
        startBtn.style.display = 'none';
        resetBtn.style.display = 'block';
        
        // 【优化】避免重复 new 实例造成组件冲突，全局只初始化一次
        if (!html5QrCode) {
            html5QrCode = new Html5Qrcode("reader");
        }
        
        // 如果由于某种原因已经在扫描中，则不再重复调用 start
        if (html5QrCode.isScanning) return;
        
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 25, qrbox: (w, h) => ({ width: w * 0.8, height: h * 0.8 }) }, 
            onScanSuccess
        ).catch(err => {
            statusText.innerHTML = `<span style="color:#ff3b30;">无法打开相机: ${err}</span>`;
            startBtn.style.display = 'block';
        });
    }

    function onScanSuccess(decodedText) {
        if (decodedText === lastScannedData) return;
        lastScannedData = decodedText;

        const parts = decodedText.split('|');
        const type = parts[0];

        if (type === 'meta' && !isMetaReceived) {
            if (parts[1] === 'text') {
                transferType = 'text';
                totalChunks = parseInt(parts[2]);
            } else if (parts[1] === 'file') {
                transferType = 'file';
                fileName = parts[2];
                totalChunks = parseInt(parts[3]);
            } else {
                transferType = 'file';
                fileName = parts[1];
                totalChunks = parseInt(parts[2]);
            }
            
            isMetaReceived = true;
            progressBg.style.display = 'block';
            
            chunksGrid.innerHTML = '';
            for(let i = 1; i <= totalChunks; i++) {
                const dot = document.createElement('div');
                dot.className = 'chunk-dot';
                dot.id = `dot-${i}`;
                dot.innerText = i;
                chunksGrid.appendChild(dot);
            }
            triggerFlash();
            updateUI();
        } 
        else if (type === 'data' && isMetaReceived) {
            const index = parseInt(parts[1]);
            const content = parts[2];

            if (!receivedChunks[index]) {
                receivedChunks[index] = content;
                const dot = document.getElementById(`dot-${index}`);
                if(dot) dot.className = 'chunk-dot done';
                
                triggerFlash();
                updateUI();
                checkCompletion();
            }
        }
    }

    function updateUI() {
        const receivedCount = Object.keys(receivedChunks).length;
        if (!isMetaReceived) {
            statusText.innerText = "正在等待读取电脑端的 [准备帧]...";
        } else {
            metaInfo.innerHTML = `<strong>模式:</strong> ${transferType === 'file' ? '文件传输' : '纯文本传输'}<br>` + 
                                (transferType === 'file' ? `<strong>文件名:</strong> ${fileName}<br>` : '') +
                                `<strong>总片数:</strong> ${totalChunks}`;
            statusText.innerHTML = `<strong>已接收数据:</strong> ${receivedCount} / ${totalChunks}`;
            progressFill.style.width = `${(receivedCount / totalChunks) * 100}%`;
        }
    }

    function checkCompletion() {
        const receivedCount = Object.keys(receivedChunks).length;
        if (receivedCount === totalChunks && totalChunks > 0) {
            statusText.innerHTML = `<span style="color:#34c759; font-weight:bold;">🎉 全部分片接收完毕！</span>`;
            
            // 【安全停机】增加状态校验，防止重复停止
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => { 
                    document.getElementById('reader-wrapper').style.display = 'none'; 
                }).catch(err => console.error("自动停机失败:", err));
            } else {
                document.getElementById('reader-wrapper').style.display = 'none';
            }
            
            if (transferType === 'file') {
                downloadBtn.style.display = 'block';
                downloadFile(); 
            } else {
                copyBtn.style.display = 'block';
                showTextPreview(); 
            }
        }
    }

    function AssembleChunks() {
        let fullBase64 = '';
        for (let i = 1; i <= totalChunks; i++) {
            fullBase64 += receivedChunks[i];
        }
        return fullBase64;
    }

    function downloadFile() {
        try {
            const fullBase64 = AssembleChunks();
            const byteCharacters = atob(fullBase64);
            const byteNumbers = new Array(byteCharacters.length);
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            const byteArray = new Uint8Array(byteNumbers);
            const blob = new Blob([byteArray], { type: 'application/octet-stream' });

            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            statusText.innerText = "文件已成功导出！请查看浏览器的下载列表。";
        } catch (e) {
            statusText.innerHTML = `<span style="color:#ff3b30;">文件下载失败: ${e.message}</span>`;
        }
    }

    function getPlainText() {
        const fullBase64 = AssembleChunks();
        return decodeURIComponent(escape(atob(fullBase64)));
    }

    function showTextPreview() {
        try {
            const text = getPlainText();
            textPreviewBox.innerText = text;
            textPreviewBox.style.display = 'block';
        } catch(e) {
            textPreviewBox.innerText = "文本解析失败: " + e.message;
        }
    }

    function copyTextData() {
        try {
            const text = getPlainText();
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.innerText = "✅ 复制成功！";
                statusText.innerHTML = `<span style="color:#34c759; font-weight:bold;">📋 文本已成功写入剪贴板。</span>`;
                setTimeout(() => { copyBtn.innerText = "📋 一键复制文本"; }, 2000);
            }).catch(err => { throw new Error(); });
        } catch (e) {
            try {
                const textarea = document.createElement('textarea');
                textarea.value = getPlainText();
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                alert("复制成功 (安全通道)");
            } catch(err) {
                alert("复制失败，请在下方预览框中手动长按全选复制。");
            }
        }
    }

    function triggerFlash() {
        mainContainer.classList.add('success-flash');
        setTimeout(() => mainContainer.classList.remove('success-flash'), 100);
    }

    // 【核心重构：绝对安全的重置逻辑】
    function resetAll() {
        if (html5QrCode) {
            try {
                // 只有处于运行扫描状态，才调用 stop
                if (html5QrCode.isScanning) {
                    html5QrCode.stop().catch(err => console.log("静默捕获Promise拒绝:", err));
                }
            } catch (e) {
                // 强行用 try...catch 吞掉同步报错，坚决不让它阻断后续 UI 代码的执行
                console.warn("强行忽略相机底层状态同步冲突:", e);
            }
        }
        
        // 彻底清空所有业务和控制变量
        fileName = '';
        totalChunks = 0;
        receivedChunks = {};
        isMetaReceived = false;
        lastScannedData = '';
        
        // 完美还原初始化 UI 状态
        document.getElementById('reader-wrapper').style.display = 'block';
        startBtn.style.display = 'block';
        downloadBtn.style.display = 'none';
        copyBtn.style.display = 'none';
        textPreviewBox.style.display = 'none';
        textPreviewBox.innerText = '';
        progressBg.style.display = 'none';
        progressFill.style.width = '0%';
        chunksGrid.innerHTML = '';
        statusText.style.color = '#1d1d1f';
        statusText.innerText = "💡 请点击下方按钮允许摄像头权限开始扫描。";
        metaInfo.innerText = '';
    }
</script>
</body>
</html>
